<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex - Retailer Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="dashboard-layout">
        <header class="header">
            <div class="header-left">
                <h1 class="logo">Reflex</h1>
                <span class="page-title">Retailer Dashboard</span>
            </div>
            <div class="header-right">
                <span id="user-info" class="user-info">Retailer</span>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>
        </header>

        <main class="main-content">
            <div class="summary-cards">
                <div class="card">
                    <div class="card-title">Total Deliveries</div>
                    <div class="card-value" id="count-total">0</div>
                </div>
                <div class="card">
                    <div class="card-title">Pending</div>
                    <div class="card-value" id="count-pending">0</div>
                </div>
                <div class="card">
                    <div class="card-title">Assigned</div>
                    <div class="card-value" id="count-assigned">0</div>
                </div>
                <div class="card">
                    <div class="card-title">Delivered</div>
                    <div class="card-value" id="count-delivered">0</div>
                </div>
            </div>

            <div class="flex justify-between align-center mb-2">
                <h2>My Deliveries</h2>
                <button id="open-create-modal" class="btn btn-primary">Create Delivery</button>
            </div>

            <div class="table-container">
                <table id="deliveries-table">
                    <thead>
                        <tr>
                            <th>Delivery ID</th>
                            <th>Customer</th>
                            <th>Address</th>
                            <th>Item</th>
                            <th>Rider</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows will be injected here -->
                        <tr>
                            <td colspan="6" style="text-align:center;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Global Footer -->
    <footer class="global-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <h2 class="logo footer-logo">Reflex</h2>
                    <p>Delivery coordination made simple.</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Reflex. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Create Delivery Modal -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Create Delivery</h3>
            </div>
            <div class="modal-body">
                <div id="create-error" class="error-message" style="display: none;"></div>
                <form id="create-form" onsubmit="return false;">
                    <div class="form-group">
                        <label>Customer Name</label>
                        <input type="text" id="customer_name" required>
                    </div>
                    <div class="form-group">
                        <label>Customer Phone</label>
                        <input type="text" id="customer_phone" required>
                    </div>
                    <div class="form-group">
                        <label>Delivery Address</label>
                        <input type="text" id="delivery_address" required>
                    </div>
                    <div class="form-group">
                        <label>Item Description</label>
                        <input type="text" id="item_description" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline" id="close-create-modal">Cancel</button>
                        <button type="submit" id="create-delivery-btn" class="btn btn-primary">Create Delivery</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="js/retailer.js"></script>
</body>

</html>
